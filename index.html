<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="IGSO Engine - Intelligent Game Server Optimization">
    <title>IGSO Engine - Server Optimization</title>
    
    <!-- Google Fonts: VT323 & Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=VT323&family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
    
    <!-- Favicon -->
    <link rel="icon" href="src/assets/logo.jpg">
    
    <!-- CSS -->
    <link rel="stylesheet" href="src/styles/index.css">
</head>
<body>
    <div id="app"></div>
    <div id="error-display" style="color:red; background: black; padding: 20px; font-family: monospace; white-space: pre-wrap;"></div>

    <script>
        window.onerror = function(message, source, lineno, colno, error) {
            document.getElementById('error-display').innerHTML += 'ERROR: ' + message + '\\n' + source + ':' + lineno + ':' + colno + '\\n' + (error ? error.stack : '') + '\\n\\n';
        };
        window.addEventListener('unhandledrejection', function(event) {
            document.getElementById('error-display').innerHTML += 'PROMISE REJECTION: ' + event.reason + '\\n\\n';
        });
    </script>

    <!-- JS -->
    <script type="module" src="src/app.js?v=3"></script>
</body>
</html>
